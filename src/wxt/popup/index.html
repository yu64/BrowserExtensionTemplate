<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      WXT は title を manifest の default_title（ツールバーのボタンの名前）に設定する。
      __MSG_ の形式は manifest でだけ翻訳されるので、画面のタイトルと lang は main.tsx が再設定する。
    -->
    <title>__MSG_extName__</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
