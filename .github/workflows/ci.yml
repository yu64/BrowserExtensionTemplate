# lint・型検査・テスト・ビルドを実行する。
#
# 初期状態では無効。非公開のリポジトリでは Actions の利用時間に上限があり、
# テンプレートをコピーしただけで、意図せず消費しないようにするため。
# - 手動で実行: Actions の画面で CI を選択し、「Run workflow」を押す。
# - 自動で実行: リポジトリの Settings → Secrets and variables → Actions → Variables で、
#   CI_ENABLED に true を設定する。main への push とプルリクエストのたびに実行される。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同じブランチで新しく実行したら、古いほうは中止する。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # 無効のときは、ジョブをスキップする。スキップしたジョブは、利用時間を消費しない。
    if: vars.CI_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 処理が止まったまま時間を消費し続けないように、上限を指定する。通常は数分で完了する。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # .prototools のバージョンと合わせる。
          node-version: 24
          cache: npm

      # postinstall で wxt prepare が実行され、型定義（.wxt）が生成される。
      - run: npm ci

      - name: lint・型検査・単体テスト
        run: npm run check

      # ubuntu-latest には Chrome がインストールされているので、Playwright のブラウザはダウンロードせずに、それを使用する。
      # Firefox の審査（AMO）で使用される検査を、事前に実行する。
      - name: Firefox 向けの検査（web-ext lint）
        run: npm run lint:firefox

      - name: E2E テスト（Playwright と Chrome）
        run: npm run e2e

      # 失敗したときは、原因を調査できるように Playwright のレポート（スクリーンショット・トレース）を保存する。
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: temp/
          retention-days: 7

      - name: ストアに提出する zip を作成
        run: |
          npm run zip
          npm run zip:firefox

      - uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: .output/*.zip
          if-no-files-found: error
